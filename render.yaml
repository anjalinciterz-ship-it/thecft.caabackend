# Render blueprint for the CFT API. This describes the service so it can be
# created from the repo, but it deliberately carries NO secret values: the
# environment below lists the keys only (sync:false keeps them out of Git), and
# the real values are set once in the Render dashboard's Environment tab.
services:
  - type: web
    name: cft-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SIGNING_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: AUTH_GOOGLE_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SIGNIN_KEY
        sync: false
      - key: AUTH_MAGIC_LINK_ENABLED
        value: "true"
      - key: AUTH_OTP_EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
